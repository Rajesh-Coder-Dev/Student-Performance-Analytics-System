<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    .app-navbar {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        padding: 12px 24px;
        border-radius: 12px;
        margin-bottom: 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .nav-brand {
        display: flex;
        align-items: center;
    }

    .brand-link {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: #ffffff;
    }

    .brand-logo-icon {
        width: 36px;
        height: 36px;
        background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }

    .brand-text-group {
        display: flex;
        flex-direction: column;
    }

    .brand-title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.2px;
        line-height: 1.2;
        color: #ffffff;
    }

    .brand-tagline {
        font-size: 11px;
        font-weight: 500;
        color: #94a3b8;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }

    .nav-menu {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .nav-item {
        color: #e2e8f0;
        text-decoration: none;
        padding: 8px 14px;
        border-radius: 7px;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .nav-item:hover {
        background-color: rgba(255, 255, 255, 0.08);
        color: #ffffff;
    }

    .nav-item.active {
        background-color: #ffffff;
        color: #0f172a !important;
        font-weight: 600;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .nav-btn-add {
        background-color: #10b981 !important;
        color: #ffffff !important;
        font-weight: 600;
        box-shadow: 0 2px 6px rgba(16, 185, 129, 0.25);
    }

    .nav-btn-add:hover {
        background-color: #059669 !important;
        transform: translateY(-1px);
    }

    .nav-btn-admin {
        background-color: #334155 !important;
        color: #e2e8f0 !important;
        font-weight: 500;
    }

    .nav-btn-admin:hover {
        background-color: #475569 !important;
    }

    .nav-user-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background-color: rgba(30, 58, 138, 0.4);
        border: 1px solid rgba(147, 197, 253, 0.3);
        color: #bfdbfe;
        padding: 6px 12px;
        border-radius: 7px;
        font-size: 13px;
        font-weight: 500;
    }

    .user-status-dot {
        width: 8px;
        height: 8px;
        background-color: #10b981;
        border-radius: 50%;
        display: inline-block;
        box-shadow: 0 0 6px #10b981;
    }

    .nav-btn-logout {
        background-color: rgba(220, 38, 38, 0.15) !important;
        color: #fca5a5 !important;
        border: 1px solid rgba(239, 68, 68, 0.3);
        font-weight: 600;
    }

    .nav-btn-logout:hover {
        background-color: #dc2626 !important;
        color: #ffffff !important;
        border-color: #dc2626;
        transform: translateY(-1px);
    }

    .nav-btn-login {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%) !important;
        color: #ffffff !important;
        font-weight: 600;
        box-shadow: 0 2px 10px rgba(37, 99, 235, 0.35);
    }

    .nav-btn-login:hover {
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%) !important;
        transform: translateY(-1px);
    }

    @media (max-width: 820px) {
        .app-navbar {
            flex-direction: column;
            align-items: stretch;
            padding: 16px;
        }

        .nav-menu {
            justify-content: flex-start;
            gap: 6px;
        }

        .brand-link {
            justify-content: center;
            margin-bottom: 6px;
        }
    }
</style>

<nav class="app-navbar">
    <div class="nav-brand">
        <a href="{% url 'home' %}" class="brand-link">
            <span class="brand-logo-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                    <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
                </svg>
            </span>
            <div class="brand-text-group">
                <span class="brand-title">Student Performance System</span>
                <span class="brand-tagline">Academic Analytics Portal</span>
            </div>
        </a>
    </div>

    <div class="nav-menu">
        <a href="{% url 'home' %}" class="nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
            Home
        </a>

        {% if user.is_authenticated and user.is_staff %}
            <a href="{% url 'dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                Dashboard
            </a>
            <a href="{% url 'student_list' %}" class="nav-item {% if request.resolver_match.url_name == 'student_list' %}active{% endif %}">
                Students
            </a>
            <a href="{% url 'student_add' %}" class="nav-item nav-btn-add">
                + Add Student
            </a>
            <a href="/admin/" target="_blank" class="nav-item nav-btn-admin" title="Open Django Administration Panel">
                Admin Panel
            </a>
            <div class="nav-user-badge">
                <span class="user-status-dot"></span>
                <span>Admin: <strong>{{ user.username }}</strong></span>
            </div>
            <a href="{% url 'admin_logout' %}" class="nav-item nav-btn-logout">
                Logout
            </a>
        {% else %}
            <a href="{% url 'admin_login' %}" class="nav-item nav-btn-login">
                Admin Login →
            </a>
        {% endif %}
    </div>
</nav>
